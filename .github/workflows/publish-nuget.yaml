name: Publish Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true

jobs:
  publish-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write # for the GitHub release upload
      id-token: write # for NuGet's Trusted Publishing
    
    steps:
    - name: Checkout code with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
      
    - name: Push Package
      shell: pwsh
      run: |
        dotnet restore
        dotnet pack -c Release -p:PackageVersion=${{ github.event.inputs.version }} --output nupkg
        dotnet nuget push nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
        gh release create ${{ github.event.inputs.version }} nupkg/*.nupkg
      env:
        GH_TOKEN: ${{ github.token }}